name: Build MindSpace Unsigned IPA & Automated Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'Tests/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release IPA
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_15*.app 2>/dev/null | head -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Zero-Network Rule (API Scan)
        run: |
          echo "Scanning for forbidden networking symbols in Sources/..."
          if grep -rnw 'Sources/' -e 'URLSession' -e 'WebKit' -e 'CFNetwork' -e 'Network.framework' -e 'NWPathMonitor'; then
            echo "ERROR: Network code detected in offline meditation app!"
            exit 1
          fi
          echo "PASS: Zero network APIs detected."

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit & Simulation Tests
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone 16|iPhone 15|iPhone 14" | head -n 1 | sed -E 's/^[[:space:]]+//' | sed -E 's/ \([0-9A-F-]+\).*//')
          echo "Using Simulator: $SIM_NAME"
          xcodebuild test \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -destination "platform=iOS Simulator,name=${SIM_NAME:-iPhone 15}" \
            -derivedDataPath build

      - name: Compile Unsigned iOS Binary
        run: |
          xcodebuild clean build \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Assemble & Zip IPA Payload
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MindSpace.app Payload/
          zip -qry MindSpace.ipa Payload
          shasum -a 256 MindSpace.ipa > MindSpace.ipa.sha256
          echo "IPA SHA-256 Digest: $(cat MindSpace.ipa.sha256)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindSpace-Unsigned-IPA
          path: |
            MindSpace.ipa
            MindSpace.ipa.sha256
          retention-days: 14

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "MindSpace v1.0.3 (Latest Release)"
          body: |
            ## MindSpace v1.0.3 Offline Celestial Meditation
            
            ### What's New in v1.0.3 (UI/UX Pro Max Redesign):
            - **Celestial Breathing Aura**: Subtle 6-breaths/min radiant expansion behind the planet to pace mindful breathing.
            - **Luminous Scrubber**: Touch-magnified scrubber thumb with real-time drag tooltip bubble and continuous tactile detents.
            - **Tactile Sensory Feedback (HapticService)**: Context-aware Taptic engine feedback on button taps, session completion, and scrubbing.
            - **Unified Cosmic Orbit Hero**: Integrated daily greeting, avatar, and orbital streak gauge in an elevated hero surface.
            - **Living Constellation Path**: Serpentine starlight Bezier curves with pulsing radar ripple on the active node and gold aura on completed nodes.
            - **Tonight's Sleep Sanctuary**: Direct 1-tap duration pills (10m, 20m, 45m, 60m) and OLED night mode.
            - **Zen / Dim Screen Mode**: Rest eyes with a one-tap minimalist dark interface for nighttime meditation.
            
            ### Direct Installation / Auto-Update:
            - **Direct Web & IPA Download**: https://mindspace-ios.vercel.app
            - **SideStore / AltStore OTA Source**: `https://mindspace-ios.vercel.app/apps.json`
          files: |
            MindSpace.ipa
            MindSpace.ipa.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
