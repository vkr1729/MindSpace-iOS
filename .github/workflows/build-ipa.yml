name: Build MindSpace Unsigned IPA & Automated Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Verify Zero-Network & Privacy Rule (API Scan)
        run: |
          echo "Scanning codebase for forbidden networking symbols..."
          FORBIDDEN_PATTERNS=("WebKit" "CFNetwork" "Network.framework" "NWPathMonitor")
          VIOLATIONS=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES=$(grep -rnw "Sources/" -e "$pattern" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ Forbidden networking symbol found for '$pattern':"
              echo "$MATCHES"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          # Ensure URLSession is strictly isolated to GitHubSyncService
          NON_SYNC_URLSESSION=$(grep -rnw "Sources/" -e "URLSession" --exclude="GitHubSyncService.swift" 2>/dev/null || true)
          if [ -n "$NON_SYNC_URLSESSION" ]; then
            echo "❌ URLSession leaked outside GitHubSyncService:"
            echo "$NON_SYNC_URLSESSION"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Build failed: Networking/telemetry symbols detected outside authorized sync service."
            exit 1
          fi
          echo "✅ Zero telemetry compliance verified. Networking strictly confined to GitHubSyncService."

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit & Simulation Tests
        run: |
          xcodebuild test \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -derivedDataPath build

      - name: Compile Unsigned iOS Binary
        run: |
          xcodebuild clean build \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Enforce & Verify UIBackgroundModes & Version in Compiled App
        run: |
          python3 -c '
          import plistlib, sys
          plist_path = "build/Build/Products/Release-iphoneos/MindSpace.app/Info.plist"
          p = plistlib.load(open(plist_path, "rb"))
          
          # Enforce required entitlements and dynamic version metadata
          source_p = plistlib.load(open("Sources/MindSpace/Info.plist", "rb"))
          expected_ver = source_p.get("CFBundleShortVersionString")
          expected_build = source_p.get("CFBundleVersion")
          
          p["CFBundleShortVersionString"] = expected_ver
          p["CFBundleVersion"] = expected_build
          
          if "UIBackgroundModes" not in p or "audio" not in p.get("UIBackgroundModes", []):
              modes = list(p.get("UIBackgroundModes", []))
              if "audio" not in modes:
                  modes.append("audio")
              p["UIBackgroundModes"] = modes
          
          p["UIFileSharingEnabled"] = True
          p["LSSupportsOpeningDocumentsInPlace"] = True
          p["UILaunchStoryboardName"] = "LaunchScreen"
          
          plistlib.dump(p, open(plist_path, "wb"))
          
          # Strict verification
          verified = plistlib.load(open(plist_path, "rb"))
          print("Verified UIBackgroundModes in compiled app:", verified.get("UIBackgroundModes"))
          print("Verified UILaunchStoryboardName:", verified.get("UILaunchStoryboardName"))
          print("Verified CFBundleShortVersionString:", verified.get("CFBundleShortVersionString"))
          print("Verified CFBundleVersion:", verified.get("CFBundleVersion"))
          
          if "audio" not in verified.get("UIBackgroundModes", []):
              print("FATAL: audio background mode missing!", file=sys.stderr)
              sys.exit(1)
          if verified.get("CFBundleShortVersionString") != expected_ver:
              print(f"FATAL: CFBundleShortVersionString is not {expected_ver}!", file=sys.stderr)
              sys.exit(1)
          if verified.get("UILaunchStoryboardName") != "LaunchScreen":
              print("FATAL: UILaunchStoryboardName is not LaunchScreen!", file=sys.stderr)
              sys.exit(1)
          '

      - name: Assemble & Zip IPA Payload
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MindSpace.app Payload/
          zip -qry MindSpace.ipa Payload
          shasum -a 256 MindSpace.ipa > MindSpace.ipa.sha256
          echo "IPA SHA-256 Digest: $(cat MindSpace.ipa.sha256)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindSpace-Unsigned-IPA
          path: |
            MindSpace.ipa
            MindSpace.ipa.sha256

      - name: Publish Direct GitHub Release to Public Distribution Repo (mindspace-source)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.MINDSPACE_SOURCE_PAT || github.token }}
        run: |
          echo "Publishing release and syncing SideStore source repository..."
          VERSION=$(python3 -c 'import json; print(json.load(open("apps.json"))["apps"][0]["version"])')
          BUILD_NUM=$(python3 -c 'import plistlib; print(plistlib.load(open("Sources/MindSpace/Info.plist", "rb")).get("CFBundleVersion", "1"))')
          DESC=$(python3 -c 'import json; print(json.load(open("apps.json"))["apps"][0].get("versionDescription", "MindSpace Release"))')
          IPA_SIZE=$(stat -f%z MindSpace.ipa 2>/dev/null || stat -c%s MindSpace.ipa)
          
          echo "Releasing MindSpace v$VERSION (Build $BUILD_NUM) with size $IPA_SIZE bytes to vkr1729/mindspace-source"
          
          # Clone public distribution repository
          rm -rf /tmp/dist_repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/vkr1729/mindspace-source.git" /tmp/dist_repo
          
          # Update apps.json and source.json in mindspace-source
          python3 -c "
          import json
          with open('/tmp/dist_repo/apps.json', 'r') as f:
              data = json.load(f)
          
          app = data['apps'][0]
          app['version'] = '$VERSION'
          app['versionDate'] = '2026-08-21'
          app['versionDescription'] = '''$DESC'''
          app['downloadURL'] = f'https://github.com/vkr1729/mindspace-source/releases/download/v$VERSION/MindSpace.ipa'
          app['size'] = int('$IPA_SIZE')
          
          new_version_entry = {
              'version': '$VERSION',
              'date': '2026-08-21',
              'localizedDescription': '''$DESC''',
              'downloadURL': f'https://github.com/vkr1729/mindspace-source/releases/download/v$VERSION/MindSpace.ipa',
              'size': int('$IPA_SIZE')
          }
          data['apps'][0]['versions'] = [v for v in data['apps'][0].get('versions', []) if v.get('version') != '$VERSION']
          data['apps'][0]['versions'].insert(0, new_version_entry)
          
          with open('/tmp/dist_repo/apps.json', 'w') as f:
              json.dump(data, f, indent=2)
          with open('/tmp/dist_repo/source.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          # Copy AppIcon-1024.png
          cp Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png /tmp/dist_repo/AppIcon-1024.png
          
          # Commit and push to mindspace-source
          cd /tmp/dist_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json source.json AppIcon-1024.png
          git commit -m "chore(release): automated sync MindSpace v$VERSION ($BUILD_NUM)" || true
          git push origin main
          
          # Create or replace GitHub Release on vkr1729/mindspace-source
          cd $GITHUB_WORKSPACE
          gh release create "v$VERSION" MindSpace.ipa MindSpace.ipa.sha256 \
            --repo vkr1729/mindspace-source \
            --title "MindSpace v$VERSION" \
            --notes "$DESC" \
            --latest || \
          gh release upload "v$VERSION" MindSpace.ipa MindSpace.ipa.sha256 \
            --repo vkr1729/mindspace-source --clobber
          
          echo "✅ Automated release and SideStore sync complete on vkr1729/mindspace-source!"
