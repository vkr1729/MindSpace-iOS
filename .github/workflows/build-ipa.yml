name: MindSpace v3 UAT and Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: Build and inspect the unsigned IPA after tests pass
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mindspace-v3-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uat:
    name: iPhone 16 Simulator UAT
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout UAT mirror
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/mindspace-python"
          "$RUNNER_TEMP/mindspace-python/bin/pip" install pillow
          echo "$RUNNER_TEMP/mindspace-python/bin" >> "$GITHUB_PATH"

      - name: Run privacy, structure, visual, and version gates
        run: python3 scripts/verify_codebase.py

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test "$(plutil -extract CFBundleShortVersionString raw Sources/MindSpace/Info.plist)" = "3.0.0"
          test "$(plutil -extract CFBundleVersion raw Sources/MindSpace/Info.plist)" = "12"
          plutil -extract UILaunchScreen xml1 -o - Sources/MindSpace/Info.plist > /dev/null
          plutil -extract UIApplicationSceneManifest xml1 -o - Sources/MindSpace/Info.plist > /dev/null

      - name: Create exact iPhone 16 simulator
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          if not runtimes:
              raise SystemExit("No available iOS simulator runtime")
          print(sorted(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))[-1]["identifier"])
          ')
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devicetypes"]
          match = next((d for d in devices if d["name"] == "iPhone 16"), None)
          if match is None:
              raise SystemExit("The iPhone 16 simulator device type is unavailable")
          print(match["identifier"])
          ')
          SIMULATOR_UDID=$(xcrun simctl create "MindSpace iPhone 16" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Created iPhone 16 simulator $SIMULATOR_UDID on $RUNTIME_ID"

      - name: Run unit and simulator UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults/MindSpace.xcresult

      - name: Export test attachments and result summary
        if: always()
        run: |
          mkdir -p TestResults/Attachments
          xcrun simctl io "$SIMULATOR_UDID" screenshot TestResults/simulator-window.png || true
          xcodebuild -project MindSpace.xcodeproj -scheme MindSpace -showBuildSettings \
            > TestResults/build-settings.txt || true
          PROCESSED_INFO="build/Build/Products/Debug-iphonesimulator/MindSpace.app/Info.plist"
          if [ -f "$PROCESSED_INFO" ]; then
            cp "$PROCESSED_INFO" TestResults/ProcessedInfo.plist
            plutil -p "$PROCESSED_INFO"
          fi
          if [ -d TestResults/MindSpace.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path TestResults/MindSpace.xcresult \
              --output-path TestResults/Attachments || true
            xcrun xcresulttool get test-results summary \
              --path TestResults/MindSpace.xcresult \
              > TestResults/summary.json || true
          fi

      - name: Compile unsigned device app
        if: inputs.build_ipa
        run: |
          xcodebuild clean build \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Assemble and verify unsigned IPA
        if: inputs.build_ipa
        run: |
          rm -rf "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/MindSpace.ipa" "$GITHUB_WORKSPACE/MindSpace.ipa.sha256"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R build/Build/Products/Release-iphoneos/MindSpace.app "$GITHUB_WORKSPACE/Payload/"
          ditto -c -k --sequesterRsrc --keepParent Payload MindSpace.ipa
          shasum -a 256 MindSpace.ipa > MindSpace.ipa.sha256
          unzip -t MindSpace.ipa
          python3 scripts/sync_version.py --verify-ipa MindSpace.ipa
          python3 scripts/inspect_release_artifact.py MindSpace.ipa

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MindSpace-v3-UAT-Evidence
          path: TestResults
          retention-days: 3
          if-no-files-found: warn

      - name: Upload tested unsigned IPA
        if: inputs.build_ipa && success()
        uses: actions/upload-artifact@v4
        with:
          name: MindSpace-v3.0.0-build12-Unsigned-IPA
          path: |
            MindSpace.ipa
            MindSpace.ipa.sha256
          retention-days: 3
          if-no-files-found: error
