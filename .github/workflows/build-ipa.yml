name: Build MindSpace Unsigned IPA & Automated Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Verify Zero-Network & Privacy Rule (API Scan)
        run: |
          echo "Scanning codebase for forbidden networking symbols..."
          FORBIDDEN_PATTERNS=("WebKit" "CFNetwork" "Network.framework" "NWPathMonitor")
          VIOLATIONS=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES=$(grep -rnw "Sources/" -e "$pattern" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ Forbidden networking symbol found for '$pattern':"
              echo "$MATCHES"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          # Ensure URLSession is strictly isolated to GitHubSyncService
          NON_SYNC_URLSESSION=$(grep -rnw "Sources/" -e "URLSession" --exclude="GitHubSyncService.swift" 2>/dev/null || true)
          if [ -n "$NON_SYNC_URLSESSION" ]; then
            echo "❌ URLSession leaked outside GitHubSyncService:"
            echo "$NON_SYNC_URLSESSION"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Build failed: Networking/telemetry symbols detected outside authorized sync service."
            exit 1
          fi
          echo "✅ Zero telemetry compliance verified. Networking strictly confined to GitHubSyncService."

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit & Simulation Tests
        run: |
          xcodebuild test \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -derivedDataPath build

      - name: Compile Unsigned iOS Binary
        run: |
          xcodebuild clean build \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Enforce & Verify UIBackgroundModes & Version in Compiled App
        run: |
          VERSION=$(python3 -c 'import plistlib; print(plistlib.load(open("Sources/MindSpace/Info.plist", "rb")).get("CFBundleShortVersionString"))')
          BUILD_NUM=$(python3 -c 'import plistlib; print(plistlib.load(open("Sources/MindSpace/Info.plist", "rb")).get("CFBundleVersion"))')
          PLIST="build/Build/Products/Release-iphoneos/MindSpace.app/Info.plist"
          
          echo "Target Version: $VERSION (Build $BUILD_NUM)"
          echo "Modifying compiled Info.plist at $PLIST"
          
          # Native PlistBuddy modification
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$PLIST"
          
          # Verify audio background mode
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          
          # Verification
          COMPILED_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          COMPILED_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          
          echo "Verified compiled CFBundleShortVersionString: $COMPILED_VER"
          echo "Verified compiled CFBundleVersion: $COMPILED_BUILD"
          
          if [ "$COMPILED_VER" != "$VERSION" ]; then
            echo "FATAL: Version mismatch in compiled plist: $COMPILED_VER != $VERSION"
            exit 1
          fi

      - name: Assemble & Zip IPA Payload
        run: |
          VERSION=$(python3 -c 'import plistlib; print(plistlib.load(open("Sources/MindSpace/Info.plist", "rb")).get("CFBundleShortVersionString"))')
          BUILD_NUM=$(python3 -c 'import plistlib; print(plistlib.load(open("Sources/MindSpace/Info.plist", "rb")).get("CFBundleVersion"))')
          
          rm -rf Payload MindSpace.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MindSpace.app Payload/
          
          # Direct enforcement inside Payload
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "Payload/MindSpace.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "Payload/MindSpace.app/Info.plist"
          
          zip -qry MindSpace.ipa Payload
          shasum -a 256 MindSpace.ipa > MindSpace.ipa.sha256
          echo "IPA SHA-256 Digest: $(cat MindSpace.ipa.sha256)"
          
          # Post-zip verification by inspecting unzipped artifact
          rm -rf /tmp/post_zip_verify
          mkdir -p /tmp/post_zip_verify
          unzip -q MindSpace.ipa -d /tmp/post_zip_verify
          ZIP_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "/tmp/post_zip_verify/Payload/MindSpace.app/Info.plist")
          echo "FINAL POST-ZIP VERIFIED VERSION INSIDE IPA: $ZIP_VER"
          if [ "$ZIP_VER" != "$VERSION" ]; then
            echo "FATAL: Post-zip verification failed! Found $ZIP_VER, expected $VERSION"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindSpace-Unsigned-IPA
          path: |
            MindSpace.ipa
            MindSpace.ipa.sha256

      - name: Publish Direct GitHub Release to Public Distribution Repo (mindspace-source)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.MINDSPACE_SOURCE_PAT || github.token }}
        run: |
          echo "Publishing release and syncing SideStore source repository..."
          VERSION=$(python3 -c 'import json; print(json.load(open("apps.json"))["apps"][0]["version"])')
          BUILD_NUM=$(python3 -c 'import plistlib; print(plistlib.load(open("Sources/MindSpace/Info.plist", "rb")).get("CFBundleVersion", "1"))')
          DESC=$(python3 -c 'import json; print(json.load(open("apps.json"))["apps"][0].get("versionDescription", "MindSpace Release"))')
          IPA_SIZE=$(stat -f%z MindSpace.ipa 2>/dev/null || stat -c%s MindSpace.ipa)
          
          echo "Releasing MindSpace v$VERSION (Build $BUILD_NUM) with size $IPA_SIZE bytes to vkr1729/mindspace-source"
          
          # Clone public distribution repository
          rm -rf /tmp/dist_repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/vkr1729/mindspace-source.git" /tmp/dist_repo
          
          # Update apps.json and source.json in mindspace-source
          python3 -c "
          import json
          with open('/tmp/dist_repo/apps.json', 'r') as f:
              data = json.load(f)
          
          app = data['apps'][0]
          app['version'] = '$VERSION'
          app['versionDate'] = '2026-08-21'
          app['versionDescription'] = '''$DESC'''
          app['downloadURL'] = f'https://github.com/vkr1729/mindspace-source/releases/download/v$VERSION/MindSpace.ipa'
          app['size'] = int('$IPA_SIZE')
          
          new_version_entry = {
              'version': '$VERSION',
              'date': '2026-08-21',
              'localizedDescription': '''$DESC''',
              'downloadURL': f'https://github.com/vkr1729/mindspace-source/releases/download/v$VERSION/MindSpace.ipa',
              'size': int('$IPA_SIZE')
          }
          data['apps'][0]['versions'] = [v for v in data['apps'][0].get('versions', []) if v.get('version') != '$VERSION']
          data['apps'][0]['versions'].insert(0, new_version_entry)
          
          with open('/tmp/dist_repo/apps.json', 'w') as f:
              json.dump(data, f, indent=2)
          with open('/tmp/dist_repo/source.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          # Copy AppIcon-1024.png
          cp Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png /tmp/dist_repo/AppIcon-1024.png
          
          # Commit and push to mindspace-source
          cd /tmp/dist_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json source.json AppIcon-1024.png
          git commit -m "chore(release): automated sync MindSpace v$VERSION ($BUILD_NUM)" || true
          git push origin main
          
          # Recreate or upload GitHub Release on vkr1729/mindspace-source
          cd $GITHUB_WORKSPACE
          gh release delete "v$VERSION" --repo vkr1729/mindspace-source -y 2>/dev/null || true
          gh release create "v$VERSION" MindSpace.ipa MindSpace.ipa.sha256 \
            --repo vkr1729/mindspace-source \
            --title "MindSpace v$VERSION" \
            --notes "$DESC" \
            --latest
          
          echo "✅ Automated release and SideStore sync complete on vkr1729/mindspace-source!"
