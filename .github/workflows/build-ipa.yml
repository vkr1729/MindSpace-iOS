name: Build MindSpace Unsigned IPA & Automated Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Verify Zero-Network Rule (API Scan)
        run: |
          echo "Scanning codebase for forbidden networking symbols..."
          FORBIDDEN_PATTERNS=("URLSession" "WebKit" "CFNetwork" "Network.framework" "NWPathMonitor")
          VIOLATIONS=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES=$(grep -rnw "Sources/" -e "$pattern" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ Zero-network violation found for '$pattern':"
              echo "$MATCHES"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Build failed: Zero-network rule violated. MindSpace must remain 100% offline."
            exit 1
          fi
          echo "✅ Zero-network compliance verified. 0 external network symbols found."

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit & Simulation Tests
        run: |
          xcodebuild test \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -derivedDataPath build

      - name: Compile Unsigned iOS Binary
        run: |
          xcodebuild clean build \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify UIBackgroundModes in Compiled App
        run: |
          python3 -c '
          import plistlib, sys
          p = plistlib.load(open("build/Build/Products/Release-iphoneos/MindSpace.app/Info.plist", "rb"))
          modes = p.get("UIBackgroundModes", [])
          print("Verified UIBackgroundModes in MindSpace.app/Info.plist:", modes)
          if "audio" not in modes:
              print("FATAL: audio background mode missing from compiled Info.plist!", file=sys.stderr)
              sys.exit(1)
          '

      - name: Assemble & Zip IPA Payload
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MindSpace.app Payload/
          zip -qry MindSpace.ipa Payload
          shasum -a 256 MindSpace.ipa > MindSpace.ipa.sha256
          echo "IPA SHA-256 Digest: $(cat MindSpace.ipa.sha256)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindSpace-Unsigned-IPA
          path: |
            MindSpace.ipa
            MindSpace.ipa.sha256

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "MindSpace v1.0.4 (Latest Release)"
          body: |
            ## MindSpace v1.0.4 Offline Celestial Meditation
            
            ### What's New in v1.0.4:
            - **Lock Screen & Background Audio Fixed**: Embedded explicit `UIBackgroundModes: [audio]` in compiled `Info.plist`, resolving background audio suspension on phone lock.
            - **Enhanced Audio Routing**: Added Bluetooth, AirPods, and AirPlay category options.
            - **NowPlaying PlaybackState Sync**: Active iOS 13+ lock screen playback state synchronization.
            - **Automated CI Plist Verification**: Added build step ensuring `UIBackgroundModes: [audio]` is strictly validated in the compiled IPA binary.
            
            ### Direct Installation / Auto-Update:
            - **Direct Web & IPA Download**: https://mindspace-ios.vercel.app
            - **SideStore / AltStore OTA Source**: `https://mindspace-ios.vercel.app/apps.json`
          files: |
            MindSpace.ipa
