name: Build MindSpace Unsigned IPA & Automated Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'Tests/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release IPA
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_15*.app 2>/dev/null | head -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Zero-Network Rule (API Scan)
        run: |
          echo "Scanning for forbidden networking symbols in Sources/..."
          if grep -rnw 'Sources/' -e 'URLSession' -e 'WebKit' -e 'CFNetwork' -e 'Network.framework' -e 'NWPathMonitor'; then
            echo "ERROR: Network code detected in offline meditation app!"
            exit 1
          fi
          echo "PASS: Zero network APIs detected."

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit & Simulation Tests
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone 16|iPhone 15|iPhone 14" | head -n 1 | sed -E 's/^[[:space:]]+//' | sed -E 's/ \([0-9A-F-]+\).*//')
          echo "Using Simulator: $SIM_NAME"
          xcodebuild test \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -destination "platform=iOS Simulator,name=${SIM_NAME:-iPhone 15}" \
            -derivedDataPath build

      - name: Compile Unsigned iOS Binary
        run: |
          xcodebuild clean build \
            -project MindSpace.xcodeproj \
            -scheme MindSpace \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Assemble & Zip IPA Payload
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MindSpace.app Payload/
          zip -qry MindSpace.ipa Payload
          shasum -a 256 MindSpace.ipa > MindSpace.ipa.sha256
          echo "IPA SHA-256 Digest: $(cat MindSpace.ipa.sha256)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindSpace-Unsigned-IPA
          path: |
            MindSpace.ipa
            MindSpace.ipa.sha256
          retention-days: 14

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "MindSpace v1.0.0 (Latest Release)"
          body: |
            ## MindSpace v1.0.0 Offline Celestial Meditation
            
            ### What's New:
            - **Full-Screen Video Mode**: Tap or expand any course/intro video into an edge-to-edge native player.
            - **Photorealistic Planet Visuals**: High-resolution, cinematic celestial assets for all 9 course categories.
            - **Lock Screen Audio Playback**: Uninterrupted offline meditation and lock screen media controls.
            - **Dynamic Daily Journey**: Next session dynamically picks from your active course.
            - **Daily Sleep Sounds**: Dedicated sleep sound card with daily rotating sounds and duration choices.
            - **5-Min Reset & SOS**: Fixed reset session routing and emergency calm relief.
            - **Active Course Progress**: Clean, privacy-first progress tracking with offline .mindspace backup/export.
            - **1024x1024 Photorealistic App Icon**.
            
            ### Direct Installation / Auto-Update:
            - **Direct IPA Download**: Download `MindSpace.ipa` directly to your iPhone.
            - **SideStore / AltStore OTA Source**: Add `https://raw.githubusercontent.com/vkr1729/MindSpace-iOS/main/dist/apps.json` to SideStore / AltStore for one-tap auto-updates on your device.
          files: |
            MindSpace.ipa
            MindSpace.ipa.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
