<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindSpace — Five UI Directions</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --canvas: #050607;
      --bg: #090c0d;
      --surface: #121617;
      --surface-2: #192021;
      --line: rgba(255,255,255,.09);
      --text: #f4f7f5;
      --muted: #9aa6a1;
      --accent: #81c9b5;
      --accent-ink: #07110e;
      --warm: #d6bd92;
      --danger: #ef9d9d;
      --radius: 20px;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --photo-1: none;
      --photo-2: none;
      --photo-3: none;
      --hero-overlay: linear-gradient(180deg, rgba(5,8,8,.08), rgba(5,8,8,.90));
    }
    body {
      margin: 0;
      min-width: 2048px;
      background: #020304;
      color: var(--text);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
    }
    body[data-direction="quiet"] {
      --canvas: #070909; --bg: #090d0c; --surface: #111715; --surface-2: #18201d;
      --line: rgba(224,242,234,.10); --text: #f2f7f4; --muted: #96a49e;
      --accent: #8bcab7; --accent-ink: #07110d; --warm: #d3bc91;
    }
    body[data-direction="editorial"] {
      --canvas: #0a0908; --bg: #0f0d0b; --surface: #191613; --surface-2: #211d19;
      --line: rgba(245,235,218,.11); --text: #f3ede3; --muted: #aaa096;
      --accent: #dbbe92; --accent-ink: #171008; --warm: #e3c79d;
      --radius: 10px; --display: Georgia, "New York", serif;
      --photo-1: url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1200&q=86');
    }
    body[data-direction="nature"] {
      --canvas: #050807; --bg: #08100d; --surface: #101915; --surface-2: #17231d;
      --line: rgba(221,239,226,.11); --text: #f1f6f1; --muted: #9aab9f;
      --accent: #a5c8a8; --accent-ink: #0b150d; --warm: #d6c3a0;
      --photo-1: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1400&q=88');
      --photo-2: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=88');
      --photo-3: url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=88');
      --hero-overlay: linear-gradient(180deg, rgba(4,10,7,.05), rgba(4,10,7,.94));
    }
    body[data-direction="abstract"] {
      --canvas: #03090c; --bg: #051015; --surface: #0b1a20; --surface-2: #10242b;
      --line: rgba(210,244,250,.11); --text: #edf8fa; --muted: #93aeb5;
      --accent: #78ced8; --accent-ink: #031316; --warm: #c7b99e;
      --photo-1: url('https://images.unsplash.com/photo-1484291470158-b8f8d608850d?auto=format&fit=crop&w=1400&q=88');
      --photo-2: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=88');
      --photo-3: url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?auto=format&fit=crop&w=1400&q=88');
      --hero-overlay: linear-gradient(180deg, rgba(2,12,17,.12), rgba(2,12,17,.92));
    }
    body[data-direction="cosmic"] {
      --canvas: #030408; --bg: #05070c; --surface: #0d111a; --surface-2: #141a26;
      --line: rgba(222,230,248,.10); --text: #f1f4fa; --muted: #9da8bb;
      --accent: #a9b9dc; --accent-ink: #080b14; --warm: #d7c7a6;
      --photo-1: url('https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?auto=format&fit=crop&w=1400&q=88');
      --photo-2: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=88');
      --photo-3: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1400&q=88');
      --hero-overlay: linear-gradient(180deg, rgba(3,5,11,.06), rgba(3,5,11,.94));
    }
    .board {
      width: 2048px;
      min-height: 2250px;
      padding: 54px 72px 64px;
      background:
        radial-gradient(circle at 88% 3%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 25%),
        linear-gradient(180deg, color-mix(in srgb, var(--canvas) 96%, #18201d), var(--canvas));
    }
    .board-header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 38px; }
    .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .16em; font-weight: 700; font-size: 16px; }
    h1 { font-family: var(--display); font-size: 54px; line-height: 1.05; letter-spacing: -.035em; margin: 10px 0 8px; font-weight: 650; }
    .board-subtitle { font-size: 19px; color: var(--muted); max-width: 1080px; line-height: 1.5; }
    .board-meta { text-align: right; color: var(--muted); line-height: 1.65; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(4, 413px); gap: 34px 58px; justify-content: center; }
    .screen-card { width: 413px; }
    .screen-label { margin: 14px 6px 0; display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); }
    .screen-label strong { color: var(--text); font-weight: 650; }
    .phone {
      width: 413px; height: 872px; padding: 10px; border-radius: 58px;
      background: linear-gradient(145deg, #565b5e, #111315 15%, #030404 75%, #44484b);
      box-shadow: 0 30px 80px rgba(0,0,0,.52), inset 0 0 0 1px rgba(255,255,255,.34);
    }
    .viewport {
      position: relative; width: 393px; height: 852px; overflow: hidden; border-radius: 49px;
      background: var(--bg); border: 1px solid rgba(255,255,255,.08);
    }
    .island { position: absolute; z-index: 20; top: 11px; left: 50%; transform: translateX(-50%); width: 116px; height: 31px; border-radius: 18px; background: #000; }
    .status { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 14px 25px 0; font-size: 13px; font-weight: 650; position: relative; z-index: 12; }
    .status .icons { letter-spacing: 2px; font-size: 11px; }
    .content { height: calc(100% - 56px); padding: 12px 20px 24px; overflow: hidden; position: relative; z-index: 2; }
    .content.with-tabs { padding-bottom: 108px; }
    .nav-title { font-family: var(--display); font-size: 31px; line-height: 1.1; letter-spacing: -.03em; margin: 2px 0 5px; font-weight: 650; }
    .lede { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .section-title { margin: 20px 0 10px; font-size: 15px; font-weight: 680; letter-spacing: -.01em; }
    .card { background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px; }
    .card + .card { margin-top: 9px; }
    .hero { min-height: 206px; padding: 18px; display: flex; flex-direction: column; justify-content: end; position: relative; overflow: hidden; }
    .hero.photo { background-image: var(--hero-overlay), var(--photo-1); background-size: cover; background-position: center 44%; }
    .hero::before { content:""; position:absolute; inset:-40% -10% 34%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent), transparent 66%); opacity:.65; pointer-events:none; }
    .hero > * { position: relative; }
    body[data-direction="quiet"] .hero::before { inset:-40% -15% 38% 45%; opacity:.28; }
    body[data-direction="editorial"] .hero::before { opacity: 0; }
    .kicker { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .13em; font-weight: 750; }
    .hero h2 { font-family: var(--display); font-size: 29px; letter-spacing: -.035em; margin: 7px 0 5px; line-height: 1.05; }
    .hero p { margin: 0; color: color-mix(in srgb, var(--text) 72%, transparent); font-size: 13px; line-height: 1.4; }
    .metric-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 12px; }
    .metric { padding: 12px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
    .metric b { display:block; font-size: 20px; margin-bottom: 2px; }
    .metric span { font-size: 10px; color: var(--muted); }
    .button { height: 50px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight: 720; font-size: 15px; margin-top: 14px; }
    .button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
    .button.inline { height: 42px; margin-top: 0; min-width: 105px; border-radius: 14px; font-size: 13px; }
    .row { display:flex; gap: 12px; align-items:center; min-height: 60px; }
    .row + .row { border-top: 1px solid var(--line); }
    .glyph { width: 42px; height: 42px; border-radius: 13px; flex: 0 0 auto; display:flex; align-items:center; justify-content:center; background: color-mix(in srgb, var(--accent) 13%, var(--surface-2)); color: var(--accent); font-size: 18px; }
    .row-copy { min-width: 0; flex: 1; }
    .row-copy b { display:block; font-size: 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row-copy span { display:block; color:var(--muted); font-size:11px; margin-top:3px; }
    .trailing { color:var(--muted); font-size:12px; }
    .progress { height: 5px; background: var(--surface-2); border-radius: 10px; overflow:hidden; margin-top: 8px; }
    .progress i { display:block; height:100%; width:45%; background:var(--accent); border-radius:inherit; }
    .chip-row { display:flex; gap:7px; overflow:hidden; margin: 13px 0 15px; }
    .chip { height:34px; padding:0 13px; border-radius:17px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; white-space:nowrap; font-size:12px; color:var(--muted); }
    .chip.active { background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700; }
    .search { height: 45px; border-radius: 14px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; padding:0 14px; color:var(--muted); margin-top: 14px; font-size: 13px; }
    .tabs { position:absolute; z-index:14; left:0; right:0; bottom:0; height:82px; display:flex; align-items:flex-start; justify-content:space-around; padding-top:12px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(24px); border-top:1px solid var(--line); }
    .tab { text-align:center; color:var(--muted); font-size:10px; min-width:62px; }
    .tab i { display:block; font-style:normal; font-size:19px; height:26px; }
    .tab.active { color:var(--accent); }
    .mini { position:absolute; z-index:15; left:12px; right:12px; bottom:76px; height:62px; border-radius:18px; display:flex; gap:11px; align-items:center; padding:9px 12px; background: color-mix(in srgb, var(--surface-2) 93%, transparent); backdrop-filter:blur(24px); border:1px solid var(--line); box-shadow:0 10px 28px rgba(0,0,0,.24); }
    .mini .glyph { width:38px; height:38px; }
    .mini .pause { font-size:19px; color:var(--text); }
    .state { display:inline-flex; gap:6px; align-items:center; padding:6px 9px; border-radius:10px; font-size:10px; font-weight:680; background:var(--surface-2); color:var(--muted); }
    .state.ok { color:var(--accent); } .state.warn { color:var(--warm); } .state.error { color:var(--danger); }
    .state-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
    .course-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .circle-button { width:44px; height:44px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
    .course-summary { text-align:center; flex:1; }
    .course-summary b { display:block; font-family:var(--display); font-size:17px; }
    .course-summary span { color:var(--muted); font-size:11px; }
    .day-list { margin-top: 12px; }
    .day { display:flex; align-items:center; gap:12px; min-height:56px; }
    .day-num { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-size:12px; }
    .day.done .day-num { background:color-mix(in srgb,var(--accent) 18%,var(--surface)); color:var(--accent); }
    .day.next .day-num { background:var(--accent); color:var(--accent-ink); }
    .download { padding:12px 14px; border:1px solid color-mix(in srgb,var(--accent) 32%,var(--line)); border-radius:16px; background:color-mix(in srgb,var(--accent) 7%,var(--surface)); margin:12px 0; }
    .download .progress i { width:62%; }
    .player-bg { position:absolute; inset:0; background-image:var(--hero-overlay), var(--photo-2); background-size:cover; background-position:center; opacity:.9; }
    body[data-direction="quiet"] .player-bg { background-image:radial-gradient(circle at 50% 36%, rgba(139,202,183,.16), transparent 24%), linear-gradient(var(--bg),var(--bg)); }
    body[data-direction="editorial"] .player-bg { background-image:linear-gradient(180deg,var(--bg),#15110e); }
    .player { display:flex; flex-direction:column; align-items:center; text-align:center; height:100%; padding: 8px 20px 30px; }
    .player-top { width:100%; display:flex; justify-content:space-between; align-items:center; }
    .player-title { margin-top: 44px; }
    .player-title .kicker { margin-bottom: 7px; }
    .player-title h2 { font-family:var(--display); font-size:29px; margin:0 0 7px; }
    .breath { width:188px; height:188px; border-radius:50%; margin:auto 0; display:flex; align-items:center; justify-content:center; border:1px solid color-mix(in srgb,var(--accent) 40%,transparent); background:radial-gradient(circle,color-mix(in srgb,var(--accent) 17%,transparent),transparent 66%); box-shadow:0 0 70px color-mix(in srgb,var(--accent) 12%,transparent); color:var(--muted); font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
    body:not([data-direction="quiet"]):not([data-direction="editorial"]) .breath { background:rgba(0,0,0,.14); backdrop-filter:blur(18px); }
    .time { font-family:var(--display); font-size:39px; letter-spacing:-.04em; }
    .scrub { width:100%; margin:15px 0 24px; }
    .scrub .progress { height:6px; }
    .scrub .progress i { width:44%; }
    .scrub-labels { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; margin-top:7px; }
    .controls { display:flex; align-items:center; gap:31px; }
    .play { width:76px; height:76px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent); color:var(--accent-ink); font-size:28px; box-shadow:0 14px 36px color-mix(in srgb,var(--accent) 18%,transparent); }
    .skip { width:50px; height:50px; border-radius:50%; background:rgba(10,12,12,.48); backdrop-filter:blur(16px); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:14px; }
    .player-tools { display:flex; justify-content:center; gap:12px; margin-top:22px; }
    .tool { min-width:92px; height:44px; border-radius:14px; background:rgba(10,12,12,.48); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; }
    .complete { text-align:center; display:flex; flex-direction:column; height:100%; }
    .check { width:86px; height:86px; border-radius:50%; background:color-mix(in srgb,var(--accent) 17%,var(--surface)); border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line)); margin:70px auto 28px; display:flex; align-items:center; justify-content:center; font-size:36px; color:var(--accent); }
    .complete h2 { font-family:var(--display); font-size:35px; margin:0 0 8px; letter-spacing:-.04em; }
    .quote { color:var(--muted); font-family:var(--display); font-size:19px; line-height:1.45; margin:38px 25px 28px; }
    .reflection { display:flex; gap:8px; justify-content:center; }
    .reflection .chip { width:48px; justify-content:center; font-size:18px; padding:0; }
    .heatmap { display:grid; grid-template-columns:repeat(14,1fr); gap:5px; margin:15px 0 7px; }
    .heatmap i { aspect-ratio:1; border-radius:4px; background:var(--surface-2); }
    .heatmap i:nth-child(4n), .heatmap i:nth-child(7n) { background:color-mix(in srgb,var(--accent) 34%,var(--surface-2)); }
    .heatmap i:nth-child(9n) { background:color-mix(in srgb,var(--accent) 72%,var(--surface-2)); }
    .setting-group { margin-top:18px; }
    .setting-group > b { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.1em; margin:0 0 8px 5px; }
    .toggle { width:43px; height:26px; border-radius:20px; background:var(--accent); padding:3px; }
    .toggle::after { content:""; display:block; width:20px; height:20px; border-radius:50%; background:var(--accent-ink); margin-left:17px; }
    .error-box { margin-top:10px; color:var(--danger); font-size:11px; line-height:1.4; padding:11px 12px; border-radius:12px; background:color-mix(in srgb,var(--danger) 8%,var(--surface)); border:1px solid color-mix(in srgb,var(--danger) 28%,var(--line)); text-align:left; }
    .onboarding { display:flex; flex-direction:column; height:100%; }
    .onboarding-photo { min-height:300px; margin:-12px -20px 24px; background-image:var(--hero-overlay),var(--photo-1); background-size:cover; background-position:center; border-radius:0 0 32px 32px; }
    body[data-direction="quiet"] .onboarding-photo { background:radial-gradient(circle at 50% 48%,rgba(139,202,183,.18),transparent 26%); min-height:260px; }
    body[data-direction="editorial"] .onboarding-photo { min-height:220px; background:linear-gradient(150deg,rgba(219,190,146,.17),transparent 58%); }
    .onboarding h2 { font-family:var(--display); font-size:40px; line-height:1.05; letter-spacing:-.045em; margin:0 0 14px; }
    .onboarding p { color:var(--muted); font-size:15px; line-height:1.55; margin:0; }
    .pager { display:flex; gap:6px; margin:22px 0; }
    .pager i { width:7px; height:7px; border-radius:5px; background:var(--surface-2); }
    .pager i:first-child { width:26px; background:var(--accent); }
    .legal { font-size:10px; color:var(--muted); line-height:1.4; margin-top:12px; }
    .board-footer { display:flex; justify-content:space-between; margin:38px auto 0; width: 1770px; color:var(--muted); font-size:15px; line-height:1.5; }
    .board-footer strong { color:var(--text); }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const directions = {
      quiet: { index:'01', name:'Quiet Native', subtitle:'Image-free, system-led, and deliberately uneventful. Hierarchy comes from type, spacing, semantic color, and native-feeling controls.', note:'No production imagery · lowest visual noise · strongest accessibility baseline' },
      editorial: { index:'02', name:'Editorial Calm', subtitle:'Typography creates warmth and distinction. A restrained serif display voice appears only in major moments; navigation remains fast and familiar.', note:'Sparse photographic reference · high typographic character · calm but more authored' },
      nature: { index:'03', name:'Nature Environments', subtitle:'Full-frame, quiet landscapes support onboarding, course context, and the player while dense library surfaces stay image-free.', note:'Environmental photography · focal areas reserved for copy · category-specific scenes' },
      abstract: { index:'04', name:'Light, Water & Mist', subtitle:'Photorealistic texture and reflected light add depth without literal objects. Imagery is contained to emotional moments, never rows or controls.', note:'Abstract photography · cool low-light grade · no decorative cutouts' },
      cosmic: { index:'05', name:'Restrained Cosmic', subtitle:'Real night environments suggest scale without planets, fantasy illustration, ornamental star fields, or game-like celestial progress.', note:'Environmental night photography · no floating bodies · realistic and low drama' }
    };
    const icon = { today:'⌂', library:'▤', progress:'▥', settings:'⚙' };
    function shell(title, body, active='today', mini=false) {
      return `<div class="phone"><div class="viewport"><div class="island"></div><div class="status"><span>9:41</span><span class="icons">● ◒ ▰</span></div>${body}${mini?miniPlayer():''}${active?tabs(active):''}</div></div><div class="screen-label"><strong>${title}</strong><span>393 × 852 pt</span></div>`;
    }
    function tabs(active) { return `<div class="tabs">${['today','library','progress','settings'].map(x=>`<div class="tab ${active===x?'active':''}"><i>${icon[x]}</i>${x[0].toUpperCase()+x.slice(1)}</div>`).join('')}</div>`; }
    function miniPlayer() { return `<div class="mini"><div class="glyph">◌</div><div class="row-copy"><b>Basics · Day 4</b><span>6:18 remaining · Offline</span></div><div class="pause">Ⅱ</div></div>`; }
    function onboarding(){return shell('Onboarding',`<section class="content onboarding"><div class="onboarding-photo"></div><span class="kicker">Welcome to MindSpace</span><h2>A quieter place to practice.</h2><p>Build a meditation rhythm that stays private, works offline, and meets you where you are.</p><div class="pager"><i></i><i></i><i></i><i></i></div><div style="margin-top:auto"><div class="button">Continue</div><div class="legal">Meditation can support wellbeing but does not replace professional medical care.</div></div></section>`,null);}
    function today(){return shell('Today + mini-player',`<section class="content with-tabs"><div style="display:flex;justify-content:space-between;align-items:start"><div><div class="lede">Good evening</div><div class="nav-title">Take a moment.</div></div><div class="circle-button">♧</div></div><div class="hero photo card" style="margin-top:18px"><span class="kicker">Today’s practice</span><h2>Continue Basics</h2><p>Day 4 · Working with distraction · 10 min</p><div class="button">Continue</div></div><div class="section-title">Daily journey <span class="state ok" style="float:right"><i class="state-dot"></i> Offline ready</span></div><div class="card"><div class="row"><div class="glyph">✓</div><div class="row-copy"><b>Arrive</b><span>One mindful breath · complete</span></div><span class="trailing">Done</span></div><div class="row"><div class="glyph">▶</div><div class="row-copy"><b>Continue Basics</b><span>Your primary session</span></div><span class="trailing">10 min</span></div><div class="row"><div class="glyph">☾</div><div class="row-copy"><b>Evening wind-down</b><span>Optional sleep practice</span></div><span class="trailing">12 min</span></div></div></section>`,'today',true);}
    function library(){return shell('Library + availability states',`<section class="content with-tabs"><div class="nav-title">Library</div><div class="lede">Courses and single sessions</div><div class="search">⌕ &nbsp; Search meditation content</div><div class="chip-row"><div class="chip active">All</div><div class="chip">Courses</div><div class="chip">Singles</div><div class="chip">SOS</div><div class="chip">Sleep</div></div><div class="section-title">Courses</div><div class="card"><div class="row"><div class="glyph">◎</div><div class="row-copy"><b>Basics</b><span>10 sessions · 3 complete</span><div class="progress"><i style="width:30%"></i></div></div><span class="state ok">Downloaded</span></div><div class="row"><div class="glyph">≈</div><div class="row-copy"><b>Managing Anxiety</b><span>10 sessions · downloading</span><div class="progress"><i style="width:62%"></i></div></div><span class="trailing">62%</span></div><div class="row"><div class="glyph">◇</div><div class="row-copy"><b>Happiness</b><span>10 sessions</span></div><span class="state warn">Stream</span></div></div><div class="section-title">Singles</div><div class="card"><div class="row"><div class="glyph">◒</div><div class="row-copy"><b>Panicking</b><span>SOS · 3 min</span></div><span class="state error">Unavailable</span></div><div class="row"><div class="glyph">≋</div><div class="row-copy"><b>Rain at Night</b><span>Sleep · 30 min</span></div><span class="trailing">›</span></div></div></section>`,'library');}
    function course(){return shell('Course detail + download',`<section class="content"><div class="course-head"><div class="circle-button">‹</div><div class="course-summary"><b>Managing Anxiety</b><span>3 of 10 sessions</span></div><div class="circle-button">•••</div></div><div class="hero photo card"><span class="kicker">Guided course</span><h2>Managing Anxiety</h2><p>Practical meditation skills for meeting anxious moments with steadiness.</p><div class="progress"><i style="width:30%"></i></div></div><div class="download"><div style="display:flex;justify-content:space-between"><b style="font-size:13px">Downloading for offline use</b><span class="state ok">62%</span></div><div class="progress"><i></i></div><div class="lede" style="margin-top:7px">6 of 10 sessions · Cancel</div></div><div class="section-title">Course progress</div><div class="card day-list"><div class="day done"><div class="day-num">✓</div><div class="row-copy"><b>Understanding anxiety</b><span>9 min · completed</span></div></div><div class="day done"><div class="day-num">✓</div><div class="row-copy"><b>Body awareness</b><span>10 min · completed</span></div></div><div class="day done"><div class="day-num">✓</div><div class="row-copy"><b>Calming the mind</b><span>10 min · completed</span></div></div><div class="day next"><div class="day-num">4</div><div class="row-copy"><b>Working with thoughts</b><span>Up next · 11 min</span></div><div class="button inline">Play</div></div><div class="day"><div class="day-num">5</div><div class="row-copy"><b>Finding steadiness</b><span>12 min</span></div></div></div></section>`,null);}
    function player(){return shell('Full player',`<div class="player-bg"></div><section class="content player"><div class="player-top"><div class="circle-button">⌄</div><span class="state ok"><i class="state-dot"></i> Offline</span><div class="circle-button">☆</div></div><div class="player-title"><div class="kicker">Basics · Day 4</div><h2>Working with distraction</h2><div class="lede">10 minute meditation</div></div><div class="breath">Breathe naturally</div><div class="time">04:18</div><div class="scrub"><div class="progress"><i></i></div><div class="scrub-labels"><span>04:18</span><span>10:00</span></div></div><div class="controls"><div class="skip">↶ 15</div><div class="play">Ⅱ</div><div class="skip">15 ↷</div></div><div class="player-tools"><div class="tool">1× Speed</div><div class="tool">Timer</div></div></section>`,null);}
    function completion(){return shell('Completion',`<section class="content complete"><div class="check">✓</div><span class="kicker">Practice complete</span><h2>Ten quiet minutes.</h2><div class="lede">Basics · Day 4 recorded once</div><div class="quote">“Notice what is here, without needing to change it.”</div><div class="card" style="text-align:left"><div class="row"><div class="glyph">↗</div><div class="row-copy"><b>4 day practice streak</b><span>Next milestone: 7 days</span><div class="progress"><i style="width:57%"></i></div></div></div></div><div class="section-title">How do you feel?</div><div class="reflection"><div class="chip">◡</div><div class="chip active">—</div><div class="chip">⌣</div></div><div style="margin-top:auto"><div class="button">Next session</div><div class="button secondary">Done</div></div></section>`,null);}
    function progress(){return shell('Progress dashboard',`<section class="content with-tabs"><div class="nav-title">Progress</div><div class="lede">A clear view of your practice</div><div class="metric-row"><div class="metric"><b>4</b><span>day streak</span></div><div class="metric"><b>86</b><span>minutes</span></div><div class="metric"><b>12</b><span>sessions</span></div></div><div class="section-title">August</div><div class="card"><div class="heatmap">${'<i></i>'.repeat(70)}</div><div class="lede">Darker days include more mindful minutes.</div></div><div class="section-title">Courses</div><div class="card"><div class="row"><div class="glyph">◎</div><div class="row-copy"><b>Basics</b><span>4 of 10 sessions</span><div class="progress"><i style="width:40%"></i></div></div><span class="trailing">›</span></div><div class="row"><div class="glyph">≈</div><div class="row-copy"><b>Managing Anxiety</b><span>3 of 10 sessions</span><div class="progress"><i style="width:30%"></i></div></div><span class="trailing">›</span></div></div><div class="section-title">Achievements</div><div class="card"><div class="row"><div class="glyph">✓</div><div class="row-copy"><b>First Week</b><span>Complete seven practice days</span></div><span class="state">Locked</span></div></div></section>`,'progress');}
    function settings(){return shell('Settings + configuration error',`<section class="content with-tabs"><div class="nav-title">Settings</div><div class="lede">Content, reminders, and your data</div><div class="setting-group"><b>Content</b><div class="card"><div class="row"><div class="glyph">⌁</div><div class="row-copy"><b>Private content repository</b><span>Configured · PAT stored in Keychain</span></div><span class="trailing">›</span></div><div class="row"><div class="glyph">⇩</div><div class="row-copy"><b>Downloaded content</b><span>3.2 GB · 84 sessions</span></div><span class="trailing">›</span></div><div class="error-box"><b>Connection could not be verified.</b><br>Check the repository name and token permissions. Your saved token was not displayed or logged.</div></div></div><div class="setting-group"><b>Practice</b><div class="card"><div class="row"><div class="glyph">♧</div><div class="row-copy"><b>Daily reminder</b><span>8:00 AM</span></div><div class="toggle"></div></div><div class="row"><div class="glyph">↗</div><div class="row-copy"><b>Show practice streak</b><span>Visible on Today and Progress</span></div><div class="toggle"></div></div></div></div><div class="setting-group"><b>Your data</b><div class="card"><div class="row"><div class="glyph">⇧</div><div class="row-copy"><b>Export backup</b><span>Progress, favorites, and preferences</span></div><span class="trailing">›</span></div><div class="row"><div class="glyph">⇩</div><div class="row-copy"><b>Import backup</b><span>Restore from a MindSpace archive</span></div><span class="trailing">›</span></div></div></div></section>`,'settings');}
    const key = new URLSearchParams(location.search).get('direction') || 'quiet';
    const d = directions[key] || directions.quiet;
    document.body.dataset.direction = key;
    document.querySelector('#app').innerHTML = `<article class="board"><header class="board-header"><div><div class="eyebrow">Direction ${d.index} · MindSpace iOS redesign</div><h1>${d.name}</h1><div class="board-subtitle">${d.subtitle}</div></div><div class="board-meta">Target: iPhone 16 · 393 × 852 pt<br>Dark-first · Dynamic Type-aware · 44 pt controls<br>${d.note}</div></header><section class="grid">${onboarding()}${today()}${library()}${course()}${player()}${completion()}${progress()}${settings()}</section><footer class="board-footer"><div><strong>Same content and information architecture in all directions.</strong><br>Comparison states: first launch, offline, downloading, unavailable, completed, and configuration error.</div><div style="text-align:right">Exploration imagery is reference-only and not a production asset decision.<br>No planets, moons, object cutouts, fantasy art, or ornamental star fields.</div></footer></article>`;
  </script>
