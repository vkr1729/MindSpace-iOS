name: MindSpace
options:
  bundleIdPrefix: com.mindspace
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CURRENT_PROJECT_VERSION: "9"
    MARKETING_VERSION: "2.2.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  MindSpace:
    type: application
    platform: iOS
    sources:
      - path: Sources/MindSpace
      - path: Resources
    info:
      path: Sources/MindSpace/Info.plist
    settings:
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Sources/MindSpace/Info.plist
      CURRENT_PROJECT_VERSION: "9"
      MARKETING_VERSION: "2.2.0"
      PRODUCT_BUNDLE_IDENTIFIER: com.mindspace.offline
      PRODUCT_NAME: MindSpace
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []

  MindSpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MindSpaceTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: "9"
      MARKETING_VERSION: "2.2.0"
      PRODUCT_BUNDLE_IDENTIFIER: com.mindspace.offline.tests
    dependencies:
      - target: MindSpace
